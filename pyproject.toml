[project]
name = "deepseek-evolve"
version = "0.1.0"
description = "Self-fine-tuning + self-innovating local DeepSeek agent on Apple Silicon (MLX)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.21"]
dev = ["pytest>=8"]

[project.scripts]
evolve = "evolve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evolve*"]
